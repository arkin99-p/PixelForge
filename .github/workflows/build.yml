name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies (CMake, build tools)
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make wget

      - name: Download and install SDL3 from official .deb package
        run: |
          SDL_VERSION="3.2.0"
          SDL_DEB="libsdl3-dev_${SDL_VERSION}-1_amd64.deb"
          SDL_DEB_URL="https://github.com/libsdl-org/SDL/releases/download/release-${SDL_VERSION}/${SDL_DEB}"
          
          wget -O /tmp/${SDL_DEB} ${SDL_DEB_URL}
          sudo dpkg -i /tmp/${SDL_DEB} || sudo apt-get install -f -y

          ldconfig -p | grep SDL3

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build --config Release

      - name: Run minimal example (quick test)
        run: |
          cd build
          ./examples/minimal/PixelForge_minimal &
          sleep 2
          killall PixelForge_minimal || true