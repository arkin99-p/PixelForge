name: Build and Test

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies for SDL3 and build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ make git \
            libx11-dev libxext-dev libxrandr-dev libxinerama-dev \
            libxcursor-dev libxi-dev libgl1-mesa-dev \
            libwayland-dev libxkbcommon-dev libegl1-mesa-dev \
            libdrm-dev libgbm-dev

      - name: Build and install SDL3 from source
        run: |
          git clone --depth 1 https://github.com/libsdl-org/SDL.git
          cd SDL
          mkdir build && cd build
          cmake .. -DCMAKE_BUILD_TYPE=Release
          sudo make install -j$(nproc)
          sudo ldconfig

      - name: Configure CMake
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build project
        run: cmake --build build --config Release

      - name: Run minimal example (quick test)
        run: |
          cd build
          ./examples/minimal/PixelForge_minimal &
          sleep 2
          killall PixelForge_minimal || true